[project]
name = "pager-zero"
version = "0.1.0"
description = "LLM on-call agent that diagnoses production incidents and prepares the fix (human-approved)."
readme = "README.md"
authors = [
    { name = "Priyanshu Gupta", email = "guptapriyanshu1822@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==4.4.3",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "mcp==1.30.0",
    "numpy==2.4.6",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "sentence-transformers==6.2.0",
    "sqlalchemy==2.1.8",
    "typer==0.28.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
pz = "pager_zero.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # formatter owns code width; long message strings are fine

[tool.ruff.lint.per-file-ignores]
"src/pager_zero/cli.py" = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
