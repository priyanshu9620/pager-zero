<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pager-Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;--panel:#0f151d;--panel2:#131b25;--line:#1d2733;--line2:#273344;
    --text:#e3e9f1;--muted:#8d9aab;--dim:#5e6b7c;
    --accent:#4fd1c5;--warn:#f6c343;--bad:#f0616d;--good:#5ad38a;--mag:#c08af5;
    --sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
  code,.mono{font-family:var(--mono);font-size:12.5px}

  header{display:flex;align-items:center;gap:14px;padding:0 22px;height:54px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  header .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  header .logo span{color:var(--muted);font-weight:500}
  header .health{margin-left:auto;color:var(--muted);font-size:12.5px;display:flex;gap:14px}
  header .health b{color:var(--text);font-weight:500}

  main{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 54px)}
  aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel);display:flex;flex-direction:column}
  section{overflow:auto;padding:22px 28px 60px}

  .fire{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
  .fire .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .fire .row{display:flex;gap:8px}
  .fire .hint{color:var(--muted);font-size:12px;line-height:1.5}.fire .hint b{color:var(--text);font-weight:600}
  .fire details{display:grid;gap:8px}.fire summary{cursor:pointer;color:var(--dim);font-size:12.5px;list-style:none}.fire summary::before{content:"▸ "}.fire details[open] summary::before{content:"▾ "}
  .blind{color:var(--mag)}
  .live{color:var(--warn)}
  .truth .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .truth .col h4{margin:0 0 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700}
  .truth .fam{font-size:16px;font-weight:600}
  .truth .marks{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
  .truth .marks .ok{color:var(--good)}.truth .marks .no{color:var(--bad)}
  .card.truth{border-color:rgba(192,138,245,.4)}
  select,input,button{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  button{cursor:pointer;font-weight:600;transition:filter .15s}button:hover{filter:brightness(1.1)}
  button.primary{background:var(--accent);color:#04201e;border-color:var(--accent)}
  button.approve{background:var(--good);color:#06240f;border-color:var(--good)}
  button.reject{background:transparent;color:var(--bad);border-color:var(--bad);font-weight:500}
  button:disabled{opacity:.45;cursor:default;filter:none}

  .listhead{padding:12px 16px 6px;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .inc{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:5px;border-left:3px solid transparent}
  .inc:hover{background:var(--panel2)}.inc.sel{background:var(--panel2);border-left-color:var(--accent)}
  .inc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .inc .name{font-weight:600;font-size:13.5px}.inc .name small{color:var(--muted);font-weight:400}
  .inc .meta{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
  .inc .meta .id{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;font-weight:600;letter-spacing:.2px}
  .pill.investigating{color:var(--accent);border-color:rgba(79,209,197,.5);background:rgba(79,209,197,.08)}
  .pill.awaiting_approval{color:var(--warn);border-color:rgba(246,195,67,.5);background:rgba(246,195,67,.08)}
  .pill.executing{color:var(--mag);border-color:rgba(192,138,245,.5);background:rgba(192,138,245,.08)}
  .pill.resolved{color:var(--good);border-color:rgba(90,211,138,.5);background:rgba(90,211,138,.08)}
  .pill.rejected,.pill.unresolved,.pill.error{color:var(--bad);border-color:rgba(240,97,109,.5);background:rgba(240,97,109,.08)}

  .alert{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:linear-gradient(180deg,var(--panel2),var(--panel));margin-bottom:18px}
  .alert .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .alert h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  .alert h2 .svc{color:var(--accent)}
  .alert .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .alert .sub code{color:var(--dim)}
  .err{color:var(--bad)}

  .pipe{display:flex;align-items:center;gap:0;margin:16px 0 0;flex-wrap:wrap}
  .pipe .st{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;font-weight:500}
  .pipe .st i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:inline-block}
  .pipe .st.done{color:var(--muted)}.pipe .st.done i{background:var(--good)}
  .pipe .st.active{color:var(--text)}.pipe .st.active i{background:var(--accent);box-shadow:0 0 0 4px rgba(79,209,197,.18);animation:pulse 1.4s ease-in-out infinite}
  .pipe .st.wait{color:var(--warn)}.pipe .st.wait i{background:var(--warn);box-shadow:0 0 0 4px rgba(246,195,67,.18)}
  .pipe .st.fail i{background:var(--bad)}.pipe .st.fail{color:var(--bad)}
  .pipe .arrow{width:28px;height:1px;background:var(--line2);margin:0 8px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(79,209,197,.15)}50%{box-shadow:0 0 0 7px rgba(79,209,197,.05)}}

  .card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--panel);margin:14px 0}
  .card h3{margin:0 0 12px;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
  .card h3 .cnt{color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
  .card.diag{border-color:rgba(90,211,138,.35)}.card.plan{border-color:rgba(246,195,67,.35)}
  .card.verify.ok{border-color:rgba(90,211,138,.5)}.card.verify.bad{border-color:rgba(240,97,109,.5)}
  .card.exec{border-color:rgba(192,138,245,.35)}

  .step{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:none}
  .step .n{color:var(--dim);text-align:right;font-family:var(--mono);font-size:12px;padding-top:2px}
  .step .call{font-family:var(--mono);font-size:12.5px}.step .call b{color:var(--accent);font-weight:500}.step .call span{color:var(--muted)}
  .step .summary{margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .step .kv{color:var(--muted);font-size:12.5px}.step .kv b{color:var(--text);font-weight:600;font-family:var(--mono);font-size:12px}
  .step .kv .up{color:var(--bad)}.step .kv .flat{color:var(--good)}
  .step .raw{margin-top:6px;color:var(--dim);font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:0;overflow:hidden;transition:max-height .2s}
  .step .raw.open{max-height:600px;overflow:auto}
  .step .toggle{color:var(--dim);font-size:11.5px;cursor:pointer;margin-top:4px;display:inline-block}.step .toggle:hover{color:var(--muted)}
  .step .note{color:var(--text);font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .step .recall{color:var(--muted);font-size:13px}.step .recall b{color:var(--text);font-weight:500}
  svg.spark{width:140px;height:34px;display:block}

  .big{font-size:17px;font-weight:600}
  .conf{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin-top:8px}
  .conf .bar{width:160px;height:6px;border-radius:999px;background:var(--line2);overflow:hidden}.conf .bar i{display:block;height:100%;background:var(--good)}
  .ev{margin:6px 0 6px 2px;color:var(--text);font-size:13.5px;display:flex;gap:10px}.ev::before{content:"▸";color:var(--good)}
  .ruled{color:var(--muted);font-size:13px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .plan .action{font-family:var(--mono);font-size:14px;background:var(--panel2);padding:10px 12px;border-radius:10px;border:1px solid var(--line2);display:inline-block}
  .plan .action b{color:var(--warn);font-weight:500}
  .kvt{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13.5px;margin-top:12px}.kvt div:nth-child(odd){color:var(--muted)}
  .actions{display:flex;gap:10px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.actions input{flex:1}
  .decided{color:var(--muted);font-size:13px;margin-top:12px}
  .verdict{font-size:20px;font-weight:700}.verdict.ok{color:var(--good)}.verdict.bad{color:var(--bad)}
  .empty{color:var(--muted);padding:60px 20px;max-width:560px;margin:0 auto;text-align:center;line-height:1.7}
  .empty h2{color:var(--text);font-size:18px;margin:0 0 8px}
  .empty ol{text-align:left;display:inline-block;margin:14px 0 0;padding-left:20px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div>Pager-Zero <span>approval console</span></div>
  <div class="health" id="health">…</div>
</header>
<main>
  <aside>
    <div class="fire">
      <div class="lbl">Fire a synthetic incident</div>
      <button class="primary" id="fire-random">🎲 Fire a random incident</button>
      <div class="hint">Family and seed are chosen server-side and <b>hidden</b> from you and the agent until it's over. Then the planted truth is revealed next to what the agent found.</div>
      <details>
        <summary>choose the failure yourself</summary>
        <select id="scenario"></select>
        <div class="row"><input id="seed" type="number" value="42" min="0" style="width:110px" title="seed"><button id="fire" style="flex:1">Fire chosen</button></div>
      </details>
    </div>
    <div class="listhead">Incidents</div>
    <div id="list"></div>
  </aside>
  <section id="detail"></section>
</main>
<script>
const $ = s => document.querySelector(s);
let selected = null, openRaw = new Set();

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ throw new Error(`${r.status} ${await r.text()}`);} return r.json(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = s => `<span class="pill ${esc(s)}">${esc(s).replace('_',' ')}</span>`;
const fmtT = ts => { try { return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch { return ts; } };
const j = o => typeof o === 'string' ? o : JSON.stringify(o);
const tryJson = s => { try { return typeof s === 'string' ? JSON.parse(s) : s; } catch { return null; } };
const num = x => typeof x === 'number' ? (Math.abs(x) >= 100 ? Math.round(x).toLocaleString() : +x.toFixed(2)) : x;

function spark(trace, bad=true){
  const vals = trace.map(p => p[1]).filter(v => typeof v === 'number'); if(vals.length < 2) return '';
  const w=140,h=34,pad=3,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts = vals.map((v,i)=>`${pad+i*(w-2*pad)/(vals.length-1)},${h-pad-(v-min)/rng*(h-2*pad)}`).join(' ');
  const color = Math.abs(vals[vals.length-1]-vals[0]) > 0.3*Math.abs(vals[0]||1) ? (bad?'var(--bad)':'var(--good)') : 'var(--good)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${color}" stroke-width="1.8" points="${pts}"/></svg>`;
}

function seriesSummary(s){
  if(!s || typeof s !== 'object' || !('last' in s)) return '';
  const lbl = Object.entries(s.labels||{}).filter(([k])=>k!=='service').map(([k,v])=>`${k}=${v}`).join(' ');
  const change = s.change_vs_start || '';
  const up = /\+\d/.test(change) && parseInt(change) > 30, down = /-\d/.test(change) && parseInt(change) < -30;
  return `<div class="summary">${s.trace ? spark(s.trace) : ''}<div class="kv"><span class="muted">${esc(s.metric)}${lbl?' · '+esc(lbl):''}</span><br><b>${num(s.first)}</b> → <b>${num(s.last)}</b> <span class="${up||down?'up':'flat'}">${esc(change)}</span>${s.first_deviation_at?`<span class="muted"> · deviated ${fmtT(s.first_deviation_at)}</span>`:''}</div></div>`;
}

function resultSummary(tool, raw){
  const d = tryJson(raw);
  if(!d) return '';
  if(Array.isArray(d.items) && d.items.length && 'last' in d.items[0]) return d.items.slice(0,4).map(seriesSummary).join('');
  if('last' in d) return seriesSummary(d);
  if(d.top_messages){ return `<div class="summary"><div class="kv"><b>${d.total_matches}</b> matching lines${d.top_messages[0]?` · top: <span style="color:var(--text)">“${esc(d.top_messages[0].message).slice(0,110)}”</span> ×${d.top_messages[0].count}`:''}</div></div>`; }
  if(typeof d.count === 'number'){ return `<div class="summary"><div class="kv"><b>${d.count}</b> ${d.count===1?'item':'items'}${d.note?` · <span class="flat">${esc(d.note)}</span>`:''}${d.items?.[0]?.version?` · <b>${esc(d.items[0].version)}</b> at ${fmtT(d.items[0].at)} (${esc(d.items[0].commit_sha)})`:''}${d.items?.[0]?.sha?` · ${d.items.slice(0,3).map(c=>`<b>${esc(c.sha)}</b> ${esc(c.message).slice(0,50)}`).join('; ')}`:''}${d.items?.[0]?.share!==undefined?` · ${d.items.slice(0,3).map(k=>`<b>${esc(k.key)}</b> ${Math.round(k.share*100)}%`).join(', ')}`:''}</div></div>`; }
  if('per_partition' in d){ return `<div class="summary"><div class="kv">total lag <b>${num(d.total)}</b> · members <b>${d.members}</b> · ${Object.keys(d.per_partition).length} partitions</div></div>`; }
  if('hit_rate' in d && 'max_memory_mb' in d){ return `<div class="summary"><div class="kv">hit rate <b>${num(d.hit_rate)}</b> · used <b>${num(d.used_memory_mb)}</b>/<b>${num(d.max_memory_mb)}</b> MB · evictions/s <b>${num(d.evictions_per_s)}</b></div></div>`; }
  if('value' in d && 'key' in d){ return `<div class="summary"><div class="kv"><b>${esc(d.key)}</b> = <b>${esc(j(d.value))}</b></div></div>`; }
  if(d.alert){ return `<div class="summary"><div class="kv">${esc(d.alert.name)} on <b>${esc(d.alert.service)}</b> · ${esc(d.services?.length||0)} services</div></div>`; }
  if(d.version && d.dependencies){ return `<div class="summary"><div class="kv">version <b>${esc(d.version)}</b> · deps ${esc((d.dependencies||[]).join(', '))||'—'} · groups ${esc((d.consumer_groups||[]).join(', '))||'—'} · caches ${esc((d.caches||[]).join(', '))||'—'}</div></div>`; }
  const keys = Object.keys(d); if(keys.length && d[keys[0]] && 'last' in d[keys[0]]) return keys.slice(0,4).map(k => seriesSummary({...d[k], metric: k})).join('');
  return '';
}

function renderTrace(trace){
  let n = 0; const rows = []; const pending = {};
  for(const e of trace){
    if(e.event === 'recall'){
      rows.push(`<div class="step"><div class="n">⌕</div><div class="recall">memory: ${e.hits.length ? e.hits.map(h => `<b>${esc(h.title)}</b> <span class="mono">(${esc(h.kind)}, sim ${esc(h.similarity)})</span>`).join(' · ') : 'no similar past incidents'}</div></div>`);
    } else if(e.event === 'llm'){
      for(const tc of (e.tool_calls||[])){ n++; const id = `r${rows.length}`; (pending[tc.name] ||= []).push(id);
        rows.push(`<div class="step"><div class="n">${n}</div><div><div class="call"><b>${esc(tc.name)}</b><span>(${esc(j(tc.args))})</span></div><div id="${id}"></div></div></div>`); }
      if(e.text && !(e.tool_calls||[]).length){ rows.push(`<div class="step"><div class="n">✎</div><div class="note">${esc(e.text)}</div></div>`); }
    } else if(e.event === 'tool_result'){
      const id = (pending[e.tool]||[]).shift(); if(!id) continue;
      const open = openRaw.has(id);
      const body = `${resultSummary(e.tool, e.result)}<span class="toggle" data-raw="${id}">${open?'hide raw ▴':'raw ▾'}</span><div class="raw ${open?'open':''}" id="${id}-raw">${esc(e.result).slice(0,4000)}</div>`;
      const i = rows.findIndex(r => r.includes(`id="${id}"`)); rows[i] = rows[i].replace(`<div id="${id}"></div>`, `<div id="${id}">${body}</div>`);
    }
  }
  return rows.join('');
}

function pipeline(inc){
  const st = inc.status, has = k => !!inc[k];
  const stages = ['triage','investigate','diagnose','plan','approval','execute','verify'];
  const cls = {};
  const done = (...xs) => xs.forEach(x => cls[x]='done');
  if(st === 'investigating'){ done('triage'); cls.investigate='active'; }
  else if(st === 'awaiting_approval'){ done('triage','investigate','diagnose','plan'); cls.approval='wait'; }
  else if(st === 'executing'){ done('triage','investigate','diagnose','plan','approval'); cls.execute='active'; }
  else if(st === 'resolved'){ done(...stages); }
  else if(st === 'rejected'){ done('triage','investigate','diagnose','plan'); cls.approval='fail'; }
  else if(st === 'unresolved'){ done('triage','investigate','diagnose'); cls.plan = has('plan') ? 'done' : 'fail'; if(has('verification')){ done('approval','execute'); cls.verify='fail'; } }
  else if(st === 'error'){ cls.investigate='fail'; }
  const label = {triage:'triage',investigate:'investigate',diagnose:'diagnose',plan:'plan fix',approval:'approval',execute:'execute',verify:'verify'};
  return `<div class="pipe">${stages.map((s,i)=>`${i?'<span class="arrow"></span>':''}<span class="st ${cls[s]||''}"><i></i>${label[s]}</span>`).join('')}</div>`;
}

async function loadHealth(){ try{ const h = await api('/healthz'); $('#health').innerHTML = `<span>model <b>${esc(h.llm)}</b></span><span>backend <b>${esc(h.backend)}</b></span><span>memory <b>${esc(h.memory)}</b></span>`; }catch(e){ $('#health').innerHTML = '<span class="err">API unreachable</span>'; } }
async function loadScenarios(){ const s = await api('/scenarios'); $('#scenario').innerHTML = s.map(x => `<option ${x==='bad-deploy'?'selected':''}>${esc(x)}</option>`).join(''); }

const label = m => m.backend === 'live'
  ? `<span class="live">⚡ ${esc(m.alert?.name)}</span> <small>on ${esc(m.alert?.service)}</small>`
  : m.scenario === 'hidden'
  ? `<span class="blind">🎲 blind incident</span> <small>hidden until over</small>`
  : `${m.blind ? '🎲 ' : ''}${esc(m.scenario)} <small>#${esc(m.seed)}</small>`;
const origin = inc => inc.backend === 'live'
  ? `<span class="live">live system</span> · paged by Alertmanager`
  : inc.scenario === 'hidden' ? '<span class="blind">scenario hidden until the incident is over</span>' : `${esc(inc.scenario)} #${esc(inc.seed)}`;

async function loadList(){
  const list = (await api('/incidents')).slice().reverse();
  $('#list').innerHTML = list.length ? list.map(m => `
    <div class="inc ${m.id===selected?'sel':''}" data-id="${esc(m.id)}">
      <div class="top"><span class="name">${label(m)}</span>${pill(m.status)}</div>
      <div class="meta"><span class="id">${esc(m.id)}</span><span>·</span><span>${fmtT(m.created)}</span><span>·</span><span>${esc((m.model||'').split('/').pop())}</span></div>
    </div>`).join('') : '<div class="empty" style="padding:30px 16px">No incidents yet.</div>';
  document.querySelectorAll('.inc').forEach(el => el.onclick = () => { selected = el.dataset.id; openRaw.clear(); render(); });
}

function emptyState(){
  return `<div class="empty"><h2>Nothing selected</h2>
    Pager-Zero investigates an alert, proposes a fix, and waits for you.
    <ol>
      <li>Press <b>Fire a random incident</b> — a failure is planted in a synthetic world; neither you nor the agent is told which. (Or pick one yourself under “choose the failure”.)</li>
      <li>Watch the tool calls appear. Read the <b>diagnosis</b> and the <b>proposed fix</b>.</li>
      <li>Click <b>Approve &amp; execute</b> (or Reject). Verification checks the metric actually recovered, then the <b>planted truth</b> is revealed beside the agent's answer.</li>
    </ol></div>`;
}

async function render(){
  if(!selected){ $('#detail').innerHTML = emptyState(); return; }
  let inc, trace;
  try { [inc, trace] = await Promise.all([api(`/incidents/${selected}`), api(`/incidents/${selected}/trace`)]); }
  catch(e){ $('#detail').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  const a = trace.find(e => e.event === 'triage')?.alert;
  const d = inc.diagnosis, p = inc.plan, v = inc.verification, x = inc.execution;
  const spinning = inc.running ? '<span class="spin"></span>' : '';
  let html = `
    <div class="alert">
      <div class="top">
        <div><h2>${spinning}${a ? `${esc(a.name)} on <span class="svc">${esc(a.service)}</span>` : esc(inc.id)}</h2>
        <div class="sub">${a ? `${esc(a.summary)} · fired ${fmtT(a.fired_at)} · ` : ''}<code>${esc(inc.id)}</code> · ${origin(inc)} · ${esc(inc.model)}${inc.error ? ` · <span class="err">${esc(inc.error)}</span>` : ''}</div></div>
        ${pill(inc.status)}
      </div>
      ${pipeline(inc)}
    </div>`;
  html += `<div class="card"><h3>Investigation <span class="cnt">${inc.steps != null ? `${esc(inc.steps)} tool call${inc.steps===1?'':'s'}` : ''}</span></h3>${renderTrace(trace) || '<span class="muted">Waiting for the agent…</span>'}</div>`;
  if(d){
    const pct = Math.round(Number(d.confidence)*100);
    html += `<div class="card diag"><h3>Diagnosis</h3>
      <div class="big">${esc(d.family)}</div>
      <div class="conf"><div class="bar"><i style="width:${pct}%"></i></div>confidence ${pct}%</div>
      <p style="margin:12px 0 10px;font-size:14.5px;line-height:1.6">${esc(d.root_cause)}</p>
      ${(d.evidence||[]).map(e => `<div class="ev"><span>${esc(e)}</span></div>`).join('')}
      ${(d.ruled_out||[]).length ? `<div class="ruled">Ruled out: ${esc(d.ruled_out.join(' · '))}</div>` : ''}</div>`;
  }
  if(p){
    html += `<div class="card plan"><h3>Proposed fix <span class="cnt">risk ${esc(p.risk)}</span></h3>
      <div class="action"><b>${esc(p.action)}</b>(${esc(Object.entries(p.target||{}).map(([k,v])=>`${k}=${j(v)}`).join(', '))})</div>
      <div class="kvt"><div>Why</div><div>${esc(p.rationale)}</div><div>Blast radius</div><div>${esc(p.blast_radius)}</div>${(p.alternatives||[]).length?`<div>Alternatives</div><div>${esc(p.alternatives.join('; '))}</div>`:''}</div>
      ${inc.status === 'awaiting_approval' ? `<div class="actions"><input id="note" placeholder="optional note for the audit trail"><button class="approve" id="approve">Approve &amp; execute</button><button class="reject" id="reject">Reject</button></div>` : ''}
      ${inc.status === 'executing' ? `<div class="decided"><span class="spin"></span>executing and verifying…</div>` : ''}
      ${inc.approval ? `<div class="decided">Decision: <b>${esc(inc.approval.decision)}</b>${inc.approval.note ? ` — “${esc(inc.approval.note)}”` : ''}</div>` : ''}</div>`;
  } else if(d && inc.status === 'unresolved'){
    html += `<div class="card plan"><h3>Proposed fix</h3><span class="muted">The agent was not confident enough to propose a fix. Left for a human.</span></div>`;
  }
  if(x){ html += `<div class="card exec"><h3>Execution</h3><div class="mono">${esc(x.detail || j(x))}</div></div>`; }
  if(v){ html += `<div class="card verify ${v.recovered?'ok':'bad'}"><h3>Verification</h3><div class="verdict ${v.recovered?'ok':'bad'}">${v.recovered?'✔ Recovered':'✘ Not recovered'}</div><p class="muted" style="margin:8px 0 0">${esc(v.note)}</p></div>`; }
  const t = inc.truth;
  if(t){
    const mark = (ok, txt) => `<span class="${ok?'ok':'no'}">${ok?'✔':'✘'} ${txt}</span>`;
    html += `<div class="card truth"><h3>Ground truth <span class="cnt">${inc.blind ? 'was hidden from you and the agent · ' : ''}revealed: ${esc(t.scenario)} #${esc(t.seed)}</span></h3>
      <div class="row2">
        <div class="col"><h4>Planted</h4><div class="fam">${esc(t.planted.family)}</div><p class="muted" style="margin:6px 0 8px;font-size:13px">${esc(t.planted.cause)}</p><div class="mono muted">${esc(t.planted.fix.action)}(${esc(Object.entries(t.planted.fix.target).map(([k,v])=>`${k}=${j(v)}`).join(', '))})</div></div>
        <div class="col"><h4>Agent concluded</h4><div class="fam">${esc(d?.family ?? '—')}</div><p class="muted" style="margin:6px 0 8px;font-size:13px">${esc(d?.root_cause ?? 'no diagnosis')}</p><div class="mono muted">${p ? `${esc(p.action)}(${esc(Object.entries(p.target||{}).map(([k,v])=>`${k}=${j(v)}`).join(', '))})` : 'no fix proposed'}</div></div>
      </div>
      <div class="marks">${mark(t.root_cause_ok,'root cause family')}${mark(t.culprit_ok,'culprit named')}${mark(t.fix_ok,'fix matches')}${v ? mark(v.recovered,'recovery verified') : ''}</div></div>`;
  }
  $('#detail').innerHTML = html;
  document.querySelectorAll('.toggle').forEach(el => el.onclick = () => { const id = el.dataset.raw; openRaw.has(id) ? openRaw.delete(id) : openRaw.add(id); render(); });
  const ap = $('#approve'), rj = $('#reject');
  if(ap) ap.onclick = () => decide('approve');
  if(rj) rj.onclick = () => decide('reject');
}

async function decide(kind){
  const note = $('#note')?.value || '';
  $('#approve').disabled = $('#reject').disabled = true;
  try { await api(`/incidents/${selected}/${kind}`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({note})}); }
  catch(e){ alert(e.message); }
  await Promise.all([loadList(), render()]);
}

async function fire(btn, body){
  const was = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>firing';
  try { const m = await api('/incidents', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)}); selected = m.id; openRaw.clear(); }
  catch(e){ alert(e.message); }
  btn.disabled = false; btn.innerHTML = was;
  await Promise.all([loadList(), render()]);
}
$('#fire-random').onclick = () => fire($('#fire-random'), {scenario: 'random'});
$('#fire').onclick = () => fire($('#fire'), {scenario: $('#scenario').value, seed: Number($('#seed').value)});

(async () => { render(); await Promise.all([loadHealth(), loadScenarios(), loadList()]); setInterval(async () => { await loadList(); if(selected) await render(); }, 2000); })();
</script>
</body>
</html>
