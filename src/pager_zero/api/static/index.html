<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pager-Zero</title>
<style>
  :root{--bg:#0b0f14;--panel:#111821;--line:#1f2a36;--text:#d7dee8;--muted:#8a97a6;--accent:#4fd1c5;--warn:#f6c343;--bad:#f0616d;--good:#5ad38a;--mag:#c08af5}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}header h1 span{color:var(--accent)}
  header .health{margin-left:auto;color:var(--muted);font-size:12px}
  main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 49px)}
  aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  section{overflow:auto;padding:18px 24px}
  .fire{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
  .fire label{color:var(--muted);font-size:12px}
  select,input,button{font:inherit;background:#0e141c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
  button{cursor:pointer}button.primary{background:var(--accent);color:#04201e;border-color:var(--accent);font-weight:600}
  button.approve{background:var(--good);color:#06240f;border-color:var(--good);font-weight:600}
  button.reject{background:transparent;color:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .inc{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
  .inc:hover,.inc.sel{background:#162130}
  .inc .row{display:flex;justify-content:space-between;gap:8px}.inc .id{color:var(--accent)}.inc .meta{color:var(--muted);font-size:12px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.investigating{color:var(--accent);border-color:var(--accent)}.pill.awaiting_approval{color:var(--warn);border-color:var(--warn)}
  .pill.executing{color:var(--mag);border-color:var(--mag)}.pill.resolved{color:var(--good);border-color:var(--good)}
  .pill.rejected,.pill.unresolved,.pill.error{color:var(--bad);border-color:var(--bad)}
  .alert{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);margin-bottom:16px}
  .alert h2{margin:0 0 4px;font-size:15px}.alert .sub{color:var(--muted);font-size:12px}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);margin:12px 0}
  .card h3{margin:0 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .card.diag{border-color:#2a4a3a}.card.plan{border-color:#4a4020}.card.verify.ok{border-color:#2a4a3a}.card.verify.bad{border-color:#4a2a2e}
  .ev{margin:3px 0 3px 14px;color:var(--text)}.ev::before{content:"• ";color:var(--muted)}
  .steps{margin:8px 0}.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .step .n{color:var(--muted);text-align:right}.step .call{color:var(--accent)}.step .res{color:var(--muted);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:60px;overflow:hidden}
  .step .res.open{max-height:none}.step .res:hover{cursor:pointer}
  .muted{color:var(--muted)}.big{font-size:18px;font-weight:600}.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
  .actions{display:flex;gap:10px;align-items:center;margin-top:12px}.actions input{flex:1}
  code{background:#0e141c;padding:1px 5px;border-radius:4px}
  .empty{color:var(--muted);padding:40px;text-align:center}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>⏸ <span>Pager-Zero</span> approval console</h1>
  <div class="health" id="health">…</div>
</header>
<main>
  <aside>
    <div class="fire">
      <label>Fire a synthetic incident</label>
      <select id="scenario"></select>
      <div style="display:flex;gap:8px"><input id="seed" type="number" value="42" min="0" style="width:110px"><button class="primary" id="fire" style="flex:1">Fire</button></div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="detail"><div class="empty">Fire an incident or select one on the left.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let selected = null, cacheList = [];

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ throw new Error(`${r.status} ${await r.text()}`);} return r.json(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = s => `<span class="pill ${esc(s)}">${esc(s).replace('_',' ')}</span>`;
const fmtT = ts => { try { return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch { return ts; } };
const j = o => typeof o === 'string' ? o : JSON.stringify(o);

async function loadHealth(){ try{ const h = await api('/healthz'); $('#health').textContent = `${h.llm} · backend ${h.backend} · memory ${h.memory}`; }catch(e){ $('#health').textContent = 'api unreachable'; } }
async function loadScenarios(){ const s = await api('/scenarios'); $('#scenario').innerHTML = s.map(x => `<option ${x==='bad-deploy'?'selected':''}>${esc(x)}</option>`).join(''); }

async function loadList(){
  cacheList = (await api('/incidents')).slice().reverse();
  $('#list').innerHTML = cacheList.length ? cacheList.map(m => `
    <div class="inc ${m.id===selected?'sel':''}" data-id="${esc(m.id)}">
      <div class="row"><span class="id">${esc(m.id)}</span>${pill(m.status)}</div>
      <div class="meta">${esc(m.scenario)} · seed ${esc(m.seed)} · ${fmtT(m.created)}</div>
    </div>`).join('') : '<div class="empty">no incidents yet</div>';
  document.querySelectorAll('.inc').forEach(el => el.onclick = () => { selected = el.dataset.id; render(); });
}

function renderTrace(trace){
  let n = 0; const rows = [];
  for(const e of trace){
    if(e.event === 'recall'){
      rows.push(`<div class="step"><div class="n">⌕</div><div><span class="muted">recall:</span> ${e.hits.length ? e.hits.map(h => `${esc(h.kind)} “${esc(h.title)}” (sim ${esc(h.similarity)})`).join(' · ') : 'no memory hits'}</div></div>`);
    } else if(e.event === 'llm'){
      for(const tc of (e.tool_calls||[])){ n++; rows.push(`<div class="step"><div class="n">${n}</div><div><span class="call">${esc(tc.name)}</span><span class="muted">(${esc(j(tc.args))})</span><div class="res" data-tool="${esc(tc.name)}"></div></div></div>`); }
      if(e.text && !(e.tool_calls||[]).length){ rows.push(`<div class="step"><div class="n">✎</div><div>${esc(e.text)}</div></div>`); }
    } else if(e.event === 'tool_result'){
      // attach to the last unfilled result box for this tool
      const idx = rows.map((r,i) => r.includes(`data-tool="${esc(e.tool)}"`) && !r.includes('class="res filled') ? i : -1).filter(i => i>=0).pop();
      if(idx !== undefined){ rows[idx] = rows[idx].replace(`<div class="res" data-tool="${esc(e.tool)}"></div>`, `<div class="res filled" data-tool="${esc(e.tool)}" title="click to expand">${esc(e.result).slice(0,2000)}</div>`); }
    }
  }
  return rows.join('');
}

async function render(){
  if(!selected){ return; }
  let inc, trace;
  try { [inc, trace] = await Promise.all([api(`/incidents/${selected}`), api(`/incidents/${selected}/trace`)]); }
  catch(e){ $('#detail').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const tri = trace.find(e => e.event === 'triage');
  const a = tri?.alert;
  const d = inc.diagnosis, p = inc.plan, v = inc.verification, x = inc.execution;
  const running = inc.running ? '<span class="spin"></span>' : '';
  let html = `
    <div class="alert">
      <div class="row" style="display:flex;justify-content:space-between;align-items:center">
        <h2>${running}${a ? `${esc(a.name)} on <span style="color:var(--accent)">${esc(a.service)}</span>` : esc(inc.id)}</h2>${pill(inc.status)}
      </div>
      <div class="sub">${a ? `${esc(a.summary)} · fired ${fmtT(a.fired_at)} · ` : ''}${esc(inc.id)} · ${esc(inc.scenario)} / seed ${esc(inc.seed)} · ${esc(inc.model)}${inc.error ? ` · <span style="color:var(--bad)">${esc(inc.error)}</span>` : ''}</div>
    </div>`;
  html += `<div class="card"><h3>Investigation ${inc.steps != null ? `· ${esc(inc.steps)} tool calls` : ''}</h3><div class="steps">${renderTrace(trace) || '<span class="muted">waiting for the agent…</span>'}</div></div>`;
  if(d){
    html += `<div class="card diag"><h3>Diagnosis</h3>
      <div class="big">${esc(d.family)} <span class="muted" style="font-size:13px;font-weight:400">confidence ${Number(d.confidence).toFixed(2)}</span></div>
      <p>${esc(d.root_cause)}</p>
      ${(d.evidence||[]).map(e => `<div class="ev">${esc(e)}</div>`).join('')}
      ${(d.ruled_out||[]).length ? `<p class="muted" style="margin-top:8px">ruled out: ${esc(d.ruled_out.join('; '))}</p>` : ''}</div>`;
  }
  if(p){
    html += `<div class="card plan"><h3>Proposed fix</h3>
      <div class="big"><code>${esc(p.action)}(${esc(j(p.target))})</code> <span class="pill">risk ${esc(p.risk)}</span></div>
      <div class="kv" style="margin-top:10px"><div>why</div><div>${esc(p.rationale)}</div><div>blast radius</div><div>${esc(p.blast_radius)}</div>${(p.alternatives||[]).length?`<div>alternatives</div><div>${esc(p.alternatives.join('; '))}</div>`:''}</div>
      ${inc.status === 'awaiting_approval' ? `<div class="actions"><input id="note" placeholder="note (optional)"><button class="approve" id="approve">Approve &amp; execute</button><button class="reject" id="reject">Reject</button></div>` : ''}
      ${inc.approval ? `<p class="muted" style="margin:10px 0 0">${esc(inc.approval.decision)}${inc.approval.note ? ` — “${esc(inc.approval.note)}”` : ''}</p>` : ''}</div>`;
  } else if(d && inc.status === 'unresolved'){
    html += `<div class="card"><h3>Proposed fix</h3><span class="muted">No confident fix — left for a human.</span></div>`;
  }
  if(x){ html += `<div class="card"><h3>Execution</h3>${esc(x.detail || j(x))}</div>`; }
  if(v){ html += `<div class="card verify ${v.recovered?'ok':'bad'}"><h3>Verification</h3><div class="big" style="color:${v.recovered?'var(--good)':'var(--bad)'}">${v.recovered?'✔ recovered':'✘ not recovered'}</div><p>${esc(v.note)}</p></div>`; }
  $('#detail').innerHTML = html;
  document.querySelectorAll('.res').forEach(el => el.onclick = () => el.classList.toggle('open'));
  const ap = $('#approve'), rj = $('#reject');
  if(ap) ap.onclick = () => decide('approve');
  if(rj) rj.onclick = () => decide('reject');
}

async function decide(kind){
  const note = $('#note')?.value || '';
  $('#approve').disabled = $('#reject').disabled = true;
  try { await api(`/incidents/${selected}/${kind}`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({note})}); }
  catch(e){ alert(e.message); }
  await Promise.all([loadList(), render()]);
}

$('#fire').onclick = async () => {
  $('#fire').disabled = true;
  try { const m = await api('/incidents', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({scenario: $('#scenario').value, seed: Number($('#seed').value)})}); selected = m.id; }
  catch(e){ alert(e.message); }
  $('#fire').disabled = false;
  await Promise.all([loadList(), render()]);
};

(async () => { await Promise.all([loadHealth(), loadScenarios(), loadList()]); setInterval(async () => { await loadList(); if(selected) await render(); }, 2000); })();
</script>
</body>
</html>
