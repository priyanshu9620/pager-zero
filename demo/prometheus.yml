global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: shop-api
    static_configs: [{ targets: ["shop-api:8000"], labels: { service: shop-api } }]
  - job_name: payments-mock
    static_configs: [{ targets: ["payments-mock:8001"], labels: { service: payments-mock } }]
  - job_name: exporter
    honor_labels: true   # keep the exporter's own `instance="offer-cache"` label
    static_configs: [{ targets: ["exporter:9100"] }]
